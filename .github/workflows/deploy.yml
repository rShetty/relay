name: Deploy Relay Gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff (errors only)
        run: ruff check --select E9,F63,F7,F82 --no-fix .

      - name: Format check with black (auto-fix)
        run: black --check --diff . || black .

      - name: Test with pytest
        run: pytest tests/ -v

      - name: Scan tracked files for credentials
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- ':!.github/workflows/' ':!*.md' ':!.env.example'; then
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  deploy:
    needs: [verify, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail

            # ── Secrets from GitHub ──────────────────────────────────
            RELAY_ENCRYPTION_KEY="${{ secrets.RELAY_ENCRYPTION_KEY }}"
            RELAY_JWT_SECRET_KEY="${{ secrets.RELAY_JWT_SECRET_KEY }}"
            RELAY_CSRF_SECRET_KEY="${{ secrets.RELAY_CSRF_SECRET_KEY }}"
            GITHUB_PAT="${{ secrets.GITHUB_PAT }}"
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}"

            # ── Clone or update repo ─────────────────────────────────
            if [ ! -d /opt/relay/.git ]; then
              rm -rf /opt/relay
              git clone https://github.com/rShetty/relay.git /opt/relay
            fi

            cd /opt/relay
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # ── Write environment file ───────────────────────────────
            # Preserve existing DB and data, update secrets
            cat > /opt/relay/.env << EOF
            RELAY_ENVIRONMENT=production
            RELAY_SERVER__HOST=0.0.0.0
            RELAY_SERVER__PORT=8000
            RELAY_SERVER__LOG_FORMAT=json
            RELAY_SERVER__LOG_LEVEL=INFO
            RELAY_ENCRYPTION_KEY=${RELAY_ENCRYPTION_KEY}
            RELAY_OAUTH__JWT_SECRET_KEY=${RELAY_JWT_SECRET_KEY}
            RELAY_SECURITY__CSRF_ENABLED=true
            RELAY_SECURITY__CSRF_SECRET_KEY=${RELAY_CSRF_SECRET_KEY}
            RELAY_SECURITY__AUDIT_ENABLED=true
            RELAY_SECURITY__AUDIT_LOG_PATH=logs/audit.log
            RELAY_DATABASE__SQLITE_PATH=data/gateway.db
            RELAY_DATABASE__REDIS_URL=redis://relay-redis:6379/0
            GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
            EOF
            chmod 600 /opt/relay/.env

            # ── Ensure data and log directories are writable by UID 1000
            mkdir -p /opt/relay/data /opt/relay/logs
            chown -R 1000:1000 /opt/relay/data /opt/relay/logs

            # ── Rebuild and restart Docker containers ────────────────
            cd /opt/relay
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            # ── Health check with retries ────────────────────────────
            sleep 10
            for i in 1 2 3 4 5 6; do
              if curl -sf http://127.0.0.1:8000/live; then
                echo ""
                echo "DEPLOY SUCCESS: relay is healthy"
                exit 0
              fi
              echo "Health check attempt $i failed, waiting..."
              sleep 5
            done

            echo "ERROR: Health check failed"
            docker logs relay-app --tail 30
            exit 1

      - name: Retry deploy (1)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/relay
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
            sleep 10
            curl -sf http://127.0.0.1:8000/live && echo "DEPLOY SUCCESS (retry 1)" || (docker logs relay-app --tail 20 && exit 1)

      - name: Retry deploy (2)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/relay
            docker compose -f docker-compose.prod.yml restart
            sleep 10
            curl -sf http://127.0.0.1:8000/live && echo "DEPLOY SUCCESS (retry 2)" || (docker logs relay-app --tail 20 && exit 1)
