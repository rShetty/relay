name: Deploy Relay Gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff (errors only)
        run: ruff check --select E9,F63,F7,F82 --no-fix .

      - name: Format check with black (auto-fix)
        run: black --check --diff . || black .

      - name: Test with pytest
        run: pytest tests/ -v

      - name: Scan tracked files for credentials
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- ':!.github/workflows/' ':!*.md' ':!.env.example'; then
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  image:
    # Build ONCE here — never on the VPS — then promote by immutable digest.
    # SBOM and signature attach to this exact artifact, so what is verified
    # is exactly what runs.
    needs: [verify, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for cosign keyless (Fulcio OIDC) signing
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_repo: ${{ steps.meta.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase repository paths; compute once, reuse below.
      - name: Compute image coordinates
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          LOWER_OWNER="${OWNER,,}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_NAME="${REPO_NAME,,}"
          echo "repo=ghcr.io/${LOWER_OWNER}/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.repo }}:latest

      - name: Generate SBOM with syft and upload as workflow artifact
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.repo }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: relay-sbom-${{ github.sha }}.spdx.json
          upload-artifact: true

      - name: Install cosign
        id: cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        id: sign
        # Attempt keyless signing; if the keyless infrastructure is
        # unavailable we record it and continue (see next step) rather than
        # silently shipping unsigned.
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.repo }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}"

      - name: Record signing outcome
        if: always()
        env:
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          IMAGE: ${{ steps.meta.outputs.repo }}@${{ steps.push.outputs.digest }}
          WORKFLOW_REF: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/deploy.yml@${{ github.ref }}
        run: |
          if [ "$SIGN_OUTCOME" = "success" ]; then
            echo "✅ Image signed with cosign keyless: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Cosign keyless signing unavailable"
              echo ""
              echo "Keyless signing did not succeed (Fulcio/Rekor unreachable or"
              echo "OIDC token rejected). The image was still pushed and SBOM'd,"
              echo "but it is UNSIGNED. Once keyless works again, verify with:"
              echo ""
              echo '```'
              echo "cosign verify ${IMAGE} \\"
              echo "  --certificate-identity-regexp='^${WORKFLOW_REF}$' \\"
              echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com"
              echo '```'
              echo ""
              echo "Fallback if keyless remains unavailable: key-based signing"
              echo "with COSIGN_KEY/COSIGN_PASSWORD repository secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::cosign keyless signing failed — image is unsigned; see job summary"
          fi

  deploy:
    needs: [verify, security, image]
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_REPO: ${{ needs.image.outputs.image_repo }}
      IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
    steps:
      - name: Deploy promoted image via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          envs: IMAGE_REPO,IMAGE_DIGEST
          script: |
            set -euo pipefail

            IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
            echo "Promoting ${IMAGE}"

            # ── Secrets from GitHub ──────────────────────────────────
            RELAY_ENCRYPTION_KEY="${{ secrets.RELAY_ENCRYPTION_KEY }}"
            RELAY_JWT_SECRET_KEY="${{ secrets.RELAY_JWT_SECRET_KEY }}"
            RELAY_CSRF_SECRET_KEY="${{ secrets.RELAY_CSRF_SECRET_KEY }}"
            GITHUB_PAT="${{ secrets.GITHUB_PAT }}"
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}"

            # ── Clone or update repo (config/compose only — NOT a rebuild)
            if [ ! -d /opt/relay/.git ]; then
              rm -rf /opt/relay
              git clone https://github.com/rShetty/relay.git /opt/relay
            fi

            cd /opt/relay
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # ── Write environment file ───────────────────────────────
            # Preserve existing DB and data, update secrets
            cat > /opt/relay/.env << EOF
            RELAY_ENVIRONMENT=production
            RELAY_SERVER__HOST=0.0.0.0
            RELAY_SERVER__PORT=8000
            RELAY_SERVER__LOG_FORMAT=json
            RELAY_SERVER__LOG_LEVEL=INFO
            RELAY_ENCRYPTION_KEY=${RELAY_ENCRYPTION_KEY}
            RELAY_OAUTH__JWT_SECRET_KEY=${RELAY_JWT_SECRET_KEY}
            RELAY_SECURITY__CSRF_ENABLED=true
            RELAY_SECURITY__CSRF_SECRET_KEY=${RELAY_CSRF_SECRET_KEY}
            RELAY_SECURITY__AUDIT_ENABLED=true
            RELAY_SECURITY__AUDIT_LOG_PATH=logs/audit.log
            RELAY_DATABASE__SQLITE_PATH=data/gateway.db
            RELAY_DATABASE__REDIS_URL=redis://relay-redis:6379/0
            GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
            EOF
            chmod 600 /opt/relay/.env

            # ── Ensure data and log directories are writable by UID 1000
            mkdir -p /opt/relay/data /opt/relay/logs
            chown -R 1000:1000 /opt/relay/data /opt/relay/logs

            # ── Pull and promote the exact digested image ────────────
            # No build happens here: RELAY_IMAGE pins the compose service to
            # the digest produced (SBOM'd, signed) by the `image` job, and
            # --no-build makes any accidental rebuild impossible.
            docker pull "${IMAGE}"
            export RELAY_IMAGE="${IMAGE}"
            cd /opt/relay
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --no-build

            # ── Health check with retries ────────────────────────────
            sleep 10
            for i in 1 2 3 4 5 6; do
              if curl -sf http://127.0.0.1:8000/live >/dev/null; then
                echo ""
                if curl -sf http://127.0.0.1:8000/ready; then
                  echo ""
                  echo "DEPLOY SUCCESS: relay is live and ready"
                else
                  echo "WARNING: relay is live but /ready reports degradation (backing services)"
                fi
                exit 0
              fi
              echo "Health check attempt $i failed, waiting..."
              sleep 5
            done

            echo "ERROR: Health check failed"
            docker logs relay-app --tail 30
            exit 1

      - name: Retry deploy (1)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          envs: IMAGE_REPO,IMAGE_DIGEST
          script: |
            set -euo pipefail
            IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
            cd /opt/relay
            docker pull "${IMAGE}"
            export RELAY_IMAGE="${IMAGE}"
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --no-build
            sleep 10
            curl -sf http://127.0.0.1:8000/live && echo "DEPLOY SUCCESS (retry 1)" || (docker logs relay-app --tail 20 && exit 1)

      - name: Retry deploy (2)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          envs: IMAGE_REPO,IMAGE_DIGEST
          script: |
            set -euo pipefail
            IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
            export RELAY_IMAGE="${IMAGE}"
            cd /opt/relay
            docker compose -f docker-compose.prod.yml restart
            sleep 10
            curl -sf http://127.0.0.1:8000/live && echo "DEPLOY SUCCESS (retry 2)" || (docker logs relay-app --tail 20 && exit 1)
