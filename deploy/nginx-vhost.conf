# Relay production reverse proxy — PRODUCTION CUTOVER
#
# Per docs/MIGRATION_GOALS.md (Governance Hub) production cutover checklist:
# "Restrict /login, /register, /app, /admin, /connectors, /settings,
# /api-keys, /access-requests to internal network/VPN; keep API endpoints
# available."
#
# Operator UI routes are limited to the Tailscale tailnet (100.64.0.0/10).
# API endpoints (tool invocation, connector runtime, health) stay reachable
# because agents authenticate with tokens.

server {
    listen 80;
    server_name relay.rajeev.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name relay.rajeev.me;

    ssl_certificate     /etc/letsencrypt/live/relay.rajeev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.rajeev.me/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Operator UI routes — tailnet only.
    location ~ ^/(login|register|app|admin|connectors|settings|api-keys|access-requests)(/|$) {
        allow 100.64.0.0/10;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    # API endpoints remain available (token-authenticated at the app).
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
